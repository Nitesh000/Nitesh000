name: Update Profile README

on:
  schedule:
    - cron: "0 */6 * * *"   # blog posts: every 6h
    - cron: "0 3 * * *"     # github stats + metrics: once daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog-posts:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update posts
        run: |
          python << 'EOF'
          import re
          import sys
          from urllib.parse import urlparse
          from xml.etree import ElementTree as ET

          import requests

          BASE_HOST = "blog.thecodingant.in"
          SITEMAP_URL = f"https://{BASE_HOST}/sitemap.xml"
          MAX_POSTS = 7

          HEADERS = {"User-Agent": "Mozilla/5.0 (README bot)"}
          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          NON_POST_SLUGS = {"", "rss.xml", "sitemap.xml", "newsletter", "rss", "sitemap"}


          def fetch_xml(url):
              resp = requests.get(url, headers=HEADERS, timeout=15)
              resp.raise_for_status()
              return ET.fromstring(resp.content)


          def is_post_url(url):
              parsed = urlparse(url)
              if parsed.netloc != BASE_HOST:
                  return False
              path = parsed.path.strip("/")
              if not path or "/" in path:
                  return False
              if path.lower() in NON_POST_SLUGS:
                  return False
              return True


          def collect_urls(root):
              entries = []
              if root.tag.endswith("sitemapindex"):
                  for sm in root.findall("sm:sitemap", NS):
                      loc = sm.find("sm:loc", NS)
                      if loc is None:
                          continue
                      try:
                          sub_root = fetch_xml(loc.text)
                      except requests.RequestException as e:
                          print(f"Skipping sub-sitemap {loc.text}: {e}")
                          continue
                      entries += collect_urls(sub_root)
              else:
                  for u in root.findall("sm:url", NS):
                      loc = u.find("sm:loc", NS)
                      if loc is None:
                          continue
                      lastmod = u.find("sm:lastmod", NS)
                      entries.append((loc.text, lastmod.text if lastmod is not None else ""))
              return entries


          def extract_title(html, fallback_slug):
              match = re.search(r'<meta property="og:title" content="([^"]+)"', html)
              if match:
                  return match.group(1)
              match = re.search(r"<title>([^<]+)</title>", html)
              if match:
                  return match.group(1).split("|")[0].strip()
              return fallback_slug.replace("-", " ").title()


          root = fetch_xml(SITEMAP_URL)
          all_entries = collect_urls(root)
          post_entries = [(url, lastmod) for url, lastmod in all_entries if is_post_url(url)]

          if not post_entries:
              print("No post URLs found in sitemap — check BASE_HOST / is_post_url filter.")
              sys.exit(1)

          post_entries.sort(key=lambda e: e[1], reverse=True)
          post_entries = post_entries[:MAX_POSTS]

          post_list = []
          for url, _ in post_entries:
              try:
                  page = requests.get(url, headers=HEADERS, timeout=15)
                  page.raise_for_status()
                  slug = urlparse(url).path.strip("/")
                  title = extract_title(page.text, slug)
              except requests.RequestException as e:
                  print(f"Skipping {url}: {e}")
                  continue
              post_list.append(f"- [{title}]({url})")

          if not post_list:
              print("Fetched sitemap but could not build any post entries.")
              sys.exit(1)

          posts_markdown = "\n".join(post_list)

          with open("README.md", "r") as f:
              content = f.read()

          pattern = r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->"
          replacement = f"<!-- BLOG-POST-LIST:START -->\n{posts_markdown}\n<!-- BLOG-POST-LIST:END -->"
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(new_content)

          print(f"✅ README updated with {len(post_list)} posts")
          EOF
      - name: Commit blog post changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated with latest blog posts"
          git pull --rebase
          git push

  update-github-stats:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    needs: update-blog-posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import re
          import sys

          import requests

          USERNAME = "Nitesh000"
          TOKEN = os.environ.get("GH_TOKEN")
          HEADERS = {"Accept": "application/vnd.github+json"}
          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"

          user_resp = requests.get(f"https://api.github.com/users/{USERNAME}", headers=HEADERS, timeout=15)
          user_resp.raise_for_status()
          user = user_resp.json()

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)

          total_stars = 0
          lang_counts = {}
          page = 1
          while True:
              resp = requests.get(
                  f"https://api.github.com/users/{USERNAME}/repos",
                  headers=HEADERS,
                  params={"per_page": 100, "page": page, "type": "owner"},
                  timeout=15,
              )
              resp.raise_for_status()
              repos = resp.json()
              if not repos:
                  break
              for repo in repos:
                  if repo.get("fork"):
                      continue
                  total_stars += repo.get("stargazers_count", 0)
                  lang = repo.get("language")
                  if lang:
                      lang_counts[lang] = lang_counts.get(lang, 0) + 1
              page += 1

          top_lang = max(lang_counts, key=lang_counts.get) if lang_counts else "N/A"

          stats_line = (
              f"🔭 **{public_repos}** public repos&nbsp;&nbsp;·&nbsp;&nbsp;"
              f"⭐ **{total_stars}** stars earned&nbsp;&nbsp;·&nbsp;&nbsp;"
              f"👥 **{followers}** followers&nbsp;&nbsp;·&nbsp;&nbsp;"
              f"🔤 Most used language: **{top_lang}**"
          )

          with open("README.md", "r") as f:
              content = f.read()

          pattern = r"<!-- GITHUB-STATS:START -->.*?<!-- GITHUB-STATS:END -->"
          replacement = f"<!-- GITHUB-STATS:START -->\n{stats_line}\n<!-- GITHUB-STATS:END -->"
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          if new_content == content:
              print("No change or markers not found — check README.md markers.")

          with open("README.md", "w") as f:
              f.write(new_content)

          print(f"✅ GitHub stats updated: {stats_line}")
          EOF
      - name: Commit stats changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Updated GitHub stats"
          git pull --rebase
          git push

  update-profile-metrics:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    needs: update-github-stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Each risky feature renders to its OWN file. If one errors (bad/missing
      # secret, upstream bug, network hiccup), it doesn't take the others down —
      # and the prune step below just won't reference that file in the README.

      - name: Render base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile-metrics-base.svg
          user: Nitesh000
          template: classic
          base: header, activity, community, repositories, metadata
          # 🏆 Achievements and 💡 Habits stay OFF: both crash with "Unexpected
          # error" on every account right now because GitHub sunset "Projects
          # (classic)" and these plugins still query that dead field. Not a
          # config issue — tracked upstream:
          # https://github.com/lowlighter/metrics/discussions/1841
          # Flip back to "yes" once a release ships the Projects V2 migration.
          plugin_achievements: no
          plugin_habits: no

      - name: Render languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile-metrics-languages.svg
          user: Nitesh000
          base: ""
          # Indepth clones + analyzes your repos for real per-line stats instead
          # of GitHub's rough language bar. Slower, and it clones whatever
          # METRICS_TOKEN can reach (private repos included, if the PAT has that
          # scope) — list anything you don't want touched below.
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: lines, bytes-size
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 15
          # plugin_languages_skipped: owner/private-client-repo

      - name: Render RSS metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile-metrics-rss.svg
          user: Nitesh000
          base: ""
          # Decorative snapshot of your latest Hashnode posts. NOT the same as
          # plugin_posts_source: hashnode, which hits Hashnode's GraphQL API —
          # the API Hashnode put behind their Pro plan in May 2026. This reads
          # the public RSS feed instead, so it keeps working on the free tier.
          # Links inside this panel are NOT clickable (GitHub strips
          # interactivity from embedded SVGs) — the clickable list is the
          # "Latest Blog Posts" section from the update-blog-posts job above.
          # Confirm blog.thecodingant.in is where your blog's rss.xml actually
          # lives before trusting this.
          plugin_rss: yes
          plugin_rss_source: https://blog.thecodingant.in/rss.xml
          plugin_rss_limit: 5

      - name: Render music metrics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          filename: profile-metrics-music.svg
          user: Nitesh000
          base: ""
          # Spotify "recently played". Needs SPOTIFY_TOKENS (see setup notes in
          # chat). Until that secret exists this render will contain an error
          # panel — the prune step below will just leave it out of the README.
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 4

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Prune broken metrics sections from README
        run: |
          python << 'EOF'
          import re

          # (filename, optional heading). Base has no heading — it's the anchor
          # section and always renders first when present.
          SECTIONS = [
              ("profile-metrics-base.svg", None),
              ("profile-metrics-languages.svg", "🈷️ Languages"),
              ("profile-metrics-rss.svg", "🗼 Latest Hashnode Posts"),
              ("profile-metrics-music.svg", "🎼 Recently Played"),
          ]

          def is_broken(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
              except FileNotFoundError:
                  return True
              return "Unexpected error" in content

          blocks = []
          for filename, heading in SECTIONS:
              if is_broken(filename):
                  print(f"Skipping {filename}: missing or contains an error panel")
                  continue
              img = f'<img src="./{filename}" alt="{heading or "GitHub metrics"}" width="100%" />'
              if heading:
                  blocks.append(f"#### {heading}\n\n<p align=\"center\">{img}</p>")
              else:
                  blocks.append(f'<p align="center">{img}</p>')

          snapshot_markdown = "\n\n".join(blocks) if blocks else "_No metrics available right now._"

          with open("README.md", "r") as f:
              readme = f.read()

          pattern = r"<!-- METRICS:START -->.*?<!-- METRICS:END -->"
          replacement = f"<!-- METRICS:START -->\n{snapshot_markdown}\n<!-- METRICS:END -->"
          new_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          if new_readme == readme:
              print("Markers not found or no change — check README.md markers.")

          with open("README.md", "w") as f:
              f.write(new_readme)

          print("✅ README metrics section updated")
          EOF
      - name: Commit README section changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Prune broken metrics sections"
          git pull --rebase
          git push
